id: T12
desc: "Pairing exactness for scalar regression: no activation, mse, no accuracy metric"
archetype: environment
trials: 3
metric: pass^k
graders:
  - type: "workspace"
    check: "file_exists"
    path: "MODEL_PLAN.md"
  - type: "workspace"
    check: "file_contains"
    path: "MODEL_PLAN.md"
    pattern: "^Status: IN-SCOPE"
  - type: "workspace"
    check: "file_contains"
    path: "MODEL_PLAN.md"
    pattern: "^Task type: scalar regression"
  - type: "workspace"
    check: "file_contains"
    path: "MODEL_PLAN.md"
    pattern: "^Last-layer activation: none"
  - type: "workspace"
    check: "file_contains"
    path: "MODEL_PLAN.md"
    pattern: "^Loss: (mse|mean_squared_error)"
  - type: "state_check"
    command: "grep -m1 '^Metrics:' MODEL_PLAN.md | grep -ci accuracy || true"
    expect: "0"
  - type: "transcript"
    check: "max_turns"
    limit: 25
scoring: binary
tracked_metrics:
  - n_turns
  - n_toolcalls
  - n_total_tokens
  - cost_usd
reference: ./reference/
elicitation_answers: {}
timeout_s: 600
